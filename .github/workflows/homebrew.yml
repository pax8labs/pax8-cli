name: Update Homebrew formula

# Fires when changesets publishes a new @pax8/cli version and pushes its tag
# (tags are shaped `@pax8/cli@<version>`). By this point the version is live
# on npm, so the generator can download the published tarball and hash it.
on:
  push:
    tags:
      - "@pax8/cli@*"
  # Manual re-run / backfill: dispatch with an explicit version.
  workflow_dispatch:
    inputs:
      version:
        description: "Published @pax8/cli version to publish a formula for (e.g. 0.2.0)"
        required: true

# Read-only against THIS repo; the write goes to the tap repo via the PAT.
permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to match release.yml (security review H-4). Dependabot
      # bumps these via the trailing `# <tag>` comments.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # Bind the dispatch input through `env` rather than interpolating the
      # `${{ }}` expression directly into the shell — otherwise a crafted
      # version string would be command injection. GITHUB_REF_NAME is a
      # runner-provided env var (not a `${{ }}` expansion), so it's already safe.
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Strip the `@pax8/cli@` prefix off the pushed tag.
            VERSION="${GITHUB_REF_NAME#@pax8/cli@}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Homebrew formula for @pax8/cli@$VERSION"

      # npm can take a few seconds to serve a freshly published version's
      # manifest/tarball; retry so a fast tag-push doesn't race the registry.
      - name: Generate formula
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node packaging/homebrew/generate-formula.mjs "$VERSION"; then
              exit 0
            fi
            echo "Attempt $attempt failed; waiting for npm to propagate..."
            sleep 15
          done
          echo "Formula generation failed after retries" >&2
          exit 1

      # Check out the tap repo with a PAT that has contents:write on it, then
      # copy the formula in and push. Requires the HOMEBREW_TAP_TOKEN secret
      # (a fine-grained PAT scoped to pax8labs/homebrew-tap). See
      # packaging/homebrew/README.md for the one-time bootstrap.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: pax8labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit formula to tap
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp packaging/homebrew/pax8.rb tap/Formula/pax8.rb
          cd tap
          git config user.name "pax8-cli-bot"
          git config user.email "bot@pax8.com"
          # Stage first, THEN check staged diff — on a fresh tap repo the
          # formula is untracked and `git diff --quiet` (unstaged only) would
          # report clean, silently skipping the very first commit.
          git add Formula/pax8.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "pax8 $VERSION"
          git push
