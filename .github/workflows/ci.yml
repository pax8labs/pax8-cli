name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          PAX8_DEMO: "1"
          NO_COLOR: "1"

      - name: Test coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: pnpm test:coverage

      - name: Audit
        run: pnpm audit
