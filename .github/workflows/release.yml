name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per security review (H-4): this workflow has
      # `contents: write` + `id-token: write` and runs `npm publish` via
      # the changesets action, so it's the highest-leverage supply-chain
      # surface in the repo. A mutable tag reference (`@v6`) here would
      # let a compromise of any upstream action ship a poisoned package.
      # Dependabot honors SHA pins with a trailing `# <tag>` comment and
      # opens PRs to bump them — see .github/dependabot.yml.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publish gate lifted (#370): the open `chore: release` PR (#535) has
      # been merged, both packages versioned to 0.2.0, CHANGELOG written.
      # Enabling `publish` here means the next push to main that consumes a
      # changeset will run `npm publish` automatically. Trusted publishing
      # via `id-token: write` (see the OIDC note below) covers auth — no
      # NPM_TOKEN secret is required.
      - name: Create release PR and publish on merge
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        # npm OIDC trusted publishing: when this workflow has `id-token: write`
        # and the @pax8 scope has the publishing repo+workflow registered as a
        # trusted publisher at https://www.npmjs.com/settings/pax8/packages,
        # `npm publish` exchanges the OIDC token for an ephemeral publish token
        # automatically — no NPM_TOKEN secret required.
        # https://docs.npmjs.com/trusted-publishers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
