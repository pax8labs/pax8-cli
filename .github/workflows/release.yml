name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per security review (H-4): this workflow has
      # `contents: write` + `id-token: write` and runs `npm publish` via
      # the changesets action, so it's the highest-leverage supply-chain
      # surface in the repo. A mutable tag reference (`@v6`) here would
      # let a compromise of any upstream action ship a poisoned package.
      # Dependabot honors SHA pins with a trailing `# <tag>` comment and
      # opens PRs to bump them — see .github/dependabot.yml.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publish gate opened 2026-06-04 (closes #370). Pushing to main now
      # invokes `pnpm changeset publish`, which publishes whichever package
      # versions in main exceed what's on the registry. The first publish
      # ships 0.1.0 for `@pax8/cli` and `@pax8/core`. Subsequent pushes do
      # nothing until a "chore: release" PR (opened by the action below
      # when a changeset is present) bumps versions and is merged.
      - name: Publish (gate opened in #370)
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        # npm OIDC trusted publishing: when this workflow has `id-token: write`
        # and each `@pax8` package has the publishing repo+workflow registered
        # as a trusted publisher (Settings → Trusted publishing on each
        # package's npm page), `npm publish` exchanges the OIDC token for
        # an ephemeral publish token automatically — no NPM_TOKEN secret
        # required. Both packages must have trusted publisher configured
        # before this workflow can publish; the 0.1.0 bootstrap was done
        # manually with `pnpm publish --otp` since trusted publishers
        # require the target package to already exist on the registry.
        # https://docs.npmjs.com/trusted-publishers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
