name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per security review (H-4): this workflow has
      # `contents: write` + `id-token: write` and runs `npm publish` via
      # the changesets action, so it's the highest-leverage supply-chain
      # surface in the repo. A mutable tag reference (`@v6`) here would
      # let a compromise of any upstream action ship a poisoned package.
      # Dependabot honors SHA pins with a trailing `# <tag>` comment and
      # opens PRs to bump them — see .github/dependabot.yml.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publish gate (see #370): we intentionally do NOT pass a `publish:`
      # command here, so this action only opens/updates the "chore: release"
      # PR and never invokes `npm publish`. Versions have been auto-bumped
      # past anything we've shipped (CHANGELOG headings for 0.2.0/0.3.0 exist
      # but the registry has nothing), and we want a deliberate human signal
      # before the first real publish.
      #
      # When the team is ready to ship the first release, restore the
      # `publish: pnpm changeset publish` input below and merge — the next
      # push to main will publish whatever the open "chore: release" PR has
      # already version-bumped to.
      - name: Create release PR (publish gated — see #370)
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          # publish: pnpm changeset publish  # gated — enable when ready to ship
          version: pnpm changeset version
          commit: "chore: release"
          title: "chore: release"
        # npm OIDC trusted publishing: when this workflow has `id-token: write`
        # and the @pax8 scope has the publishing repo+workflow registered as a
        # trusted publisher at https://www.npmjs.com/settings/pax8/packages,
        # `npm publish` exchanges the OIDC token for an ephemeral publish token
        # automatically — no NPM_TOKEN secret required.
        # https://docs.npmjs.com/trusted-publishers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
