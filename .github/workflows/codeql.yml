name: CodeQL

# Static analysis (SAST) for JavaScript / TypeScript. Runs on every push to
# main, every PR targeting main, and on a weekly schedule for a deeper scan.
# Findings surface in the repo Security tab once "Code scanning" is enabled
# in repo settings (one-time admin step, tracked in #138).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned per security review (H-4). Dependabot bumps SHA pins
      # that carry a trailing `# <tag>` comment — see .github/dependabot.yml.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Initialize CodeQL BEFORE the build so it can observe compiler output
      # and trace the TypeScript -> JavaScript transformation in our pnpm
      # workspaces. `security-extended` is GitHub's recommended query suite
      # for OSS projects — broader coverage than `security-and-quality` minus
      # the noisier code-quality rules.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Build
        run: pnpm build

      # `continue-on-error: true` is intentional while the repo is private:
      # CodeQL's upload step requires `code_security` enabled at the repo
      # level, which on a private repo requires a paid GitHub Advanced
      # Security license. The scan itself runs and produces SARIF; only the
      # upload fails with "Code Security must be enabled for this repository
      # to use code scanning." That failure shouldn't block every PR's CI.
      #
      # On a public repo, code scanning is free — the upload starts working
      # automatically the moment the v0.1.0 public flip happens. Remove this
      # `continue-on-error` once that's done so a future regression in the
      # scan surfaces as a hard failure. Tracked in #138.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        continue-on-error: true
        with:
          category: "/language:javascript-typescript"
